name: Build and Test Addon

on:
  workflow_run:
    workflows:
      - "Auto Unzip Addon"
    types:
      - completed
    branches:
      - main

  workflow_dispatch:

jobs:
  build-test:
    # Only continue automatically if Auto Unzip Addon finished successfully.
    # Manual workflow_dispatch runs are also allowed.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify extracted addon files
        shell: bash
        run: |
          test -f addon.js || { echo "addon.js not found"; exit 1; }
          test -f package.json || { echo "package.json not found"; exit 1; }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Syntax check
        run: npm run check

      - name: Start addon and test manifest
        shell: bash
        run: |
          set -e

          npm start > addon.log 2>&1 &
          ADDON_PID=$!

          cleanup() {
            kill "$ADDON_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:7000/manifest.json > manifest.json; then
              echo "Manifest endpoint is responding."
              cat manifest.json
              exit 0
            fi
            sleep 1
          done

          echo "Addon did not become ready."
          cat addon.log || true
          exit 1
