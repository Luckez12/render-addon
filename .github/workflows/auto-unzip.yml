name: Auto Unzip Addon

on:
  push:
    branches:
      - main
    paths:
      - "*.zip"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find ZIP file
        shell: bash
        run: |
          set -euo pipefail

          mapfile -d '' ZIP_FILES < <(
            find . -maxdepth 1 -type f -name "*.zip" -print0
          )

          ZIP_COUNT="${#ZIP_FILES[@]}"

          if [ "$ZIP_COUNT" -eq 0 ]; then
            echo "No ZIP file found in repository root."
            exit 1
          fi

          if [ "$ZIP_COUNT" -gt 1 ]; then
            echo "More than one ZIP file found in repository root:"
            printf ' - %s\n' "${ZIP_FILES[@]}"
            echo "Keep only one ZIP file and try again."
            exit 1
          fi

          ZIP_PATH="${ZIP_FILES[0]}"
          ZIP_NAME="${ZIP_PATH#./}"

          echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"
          echo "Using ZIP: $ZIP_NAME"

      - name: Extract addon files to repository root
        shell: bash
        run: |
          set -euo pipefail
          unzip -o "$ZIP_NAME" -d .

      - name: Remove uploaded ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$ZIP_NAME"

      - name: Commit extracted files and ZIP removal
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: extract addon package"
            git push
          fi
