name: Auto Unzip Addon

on:
  push:
    branches:
      - main
    paths:
      - "render-addon.zip"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify ZIP exists
        shell: bash
        run: |
          test -f render-addon.zip || {
            echo "render-addon.zip not found."
            exit 1
          }

      - name: Extract addon files to repository root
        shell: bash
        run: |
          unzip -o render-addon.zip -d .

      - name: Remove uploaded ZIP
        shell: bash
        run: |
          rm -f render-addon.zip

      - name: Commit extracted files and ZIP removal
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: extract addon package"
            git push
          fi
